# host.patch.yml — 覆盖 dsh webserver 绑定地址
#
# dsh 默认只绑 127.0.0.1（安全设计：Web API 可执行代码，裸机暴露=RCE）。
# 官方 CLI 旗标 --host 0.0.0.0 被禁止，但 config schema 本身允许，
# 用 patch 层覆盖是官方留的正路；容器场景由 Docker 端口映射代偿边界。
#
# 注意：patch 是整行替换 webserver 行的 config，host/port 必须显式给出；
# compression 等其余键有 schema default，无需照抄（runzhliu 镜像实证）。
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: '0.0.0.0'
    port: 3080
